# Render 部署（后端 API + Postgres）—— 公网 Demo 简历项
# 前置：Render Dashboard → New → Blueprint → 连接本仓库
services:
  - type: web
    name: qingshenghuo-api
    runtime: node
    plan: free
    region: singapore
    # ⚠️ 必须带 --include=dev：下面 envVars 设了 NODE_ENV=production，而该变量对 **build 阶段同样生效**，
    #    npm 在 NODE_ENV=production 下会跳过 devDependencies —— 但构建恰恰依赖 devDeps 里的
    #    nest CLI（`npm run build -w @qsh/api`）与 prisma CLI（`npx prisma db push`）。
    #    不加 --include=dev 时这些 CLI 缺失，构建必然失败。
    #
    # ⚠️ 顺序关键：`prisma generate`（PG）必须放在 `npm run build` **之后**（不是之前）。
    #    原因（本地实测）：本仓库应用 TS 代码是按 **SQLite schema 的类型**编写的
    #    （id: number / 日期: string）；而 PG schema 生成的是 BigInt / Date 类型。
    #    若在 build **之前**先切到 PG 客户端，`nest build` 的 tsc 会因 87 处（实测）
    #    「bigint 不能赋给 number」「Date 不能赋给 string」直接失败 → 生产构建红。
    #    正确做法：compile 阶段沿用 SQLite 类型（同今天；**构建产物 JS 与类型无关**）；
    #    构建后再 `prisma generate --schema schema.pg.prisma` 把**运行时**默认客户端换成 PG，
    #    再 db push 建表。于是线上运行期 `require('@prisma/client')` 拿到的是 PG 客户端，
    #    不会再出现「the URL must start with the protocol file:」的启动失败。
    #    两套 schema 的漂移由 CI 的 `check-schema-parity.mjs` + `prisma validate` 守卫。
    #
    #    最后一段 `npm run build -w @qsh/web` 构建前端 SPA；`main.ts` 在生产模式下由 API
    #    同源伺服 `apps/web/dist`（静态 + SPA 回退），因此 **一个 Render URL 即完整 Demo**
    #    （前端无需单独部署到 Cloudflare；CORS 也因同源而无需配置）。
    buildCommand: npm install --include=dev && npm run build -w @qsh/api && npm run build -w @qsh/web && npx prisma generate --schema apps/api/prisma/schema.pg.prisma && npx prisma db push --schema apps/api/prisma/schema.pg.prisma && node apps/api/scripts/sync-embeddings-pg.mjs
    startCommand: node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL_PG
        fromDatabase:
          name: qingshenghuo-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # --- AI（三期 R9）：以下均为**非密**配置，可入库 ---
      # 总开关：true 走真实 LLM；false 强制规则兜底（成本熔断 / 故障降级）。
      - key: AI_ENABLED
        value: "true"
      # OpenAI 兼容接口地址（默认值抄自 apps/api/src/config/app-config.ts）。
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
      # 模型名（默认值抄自 apps/api/src/config/app-config.ts）。
      - key: AI_MODEL
        value: "gpt-4o-mini"
      #
      # ⚠️ AI_API_KEY 绝不能写进仓库：请在 Render Dashboard → 本服务 → Environment **手动新增**
      #    key=AI_API_KEY，value=你的 LLM key（如 sk-...）。未配置时 AI 入口降级为规则兜底。
      #
      # 说明：以下两项当前**未被代码读取**（硬编码在 apps/api/src/ai/ai.constants.ts：
      #   AI_MAX_OUTPUT_TOKENS=512、AI_REQUEST_TIMEOUT_MS=15000），故此处仅记录默认值、暂不生效；
      #   若后续把常量改为读环境变量，取消注释即可。
      # - key: AI_MAX_OUTPUT_TOKENS
      #   value: "512"
      # - key: AI_REQUEST_TIMEOUT_MS
      #   value: "15000"
      # --- CORS 白名单（变量名：CORS_ORIGINS，逗号分隔；见 apps/api/src/config/app-config.ts）---
      # ⚠️ 占位域名：把 qingshenghuo.pages.dev 换成你 Cloudflare Pages 实际分配的项目域名后再部署。
      #    若前端经 apps/web/public/_redirects 同源反代 /api，浏览器视角为同源，CORS 通常不触发；
      #    此处仍显式配置，以防前端直连后端。
      - key: CORS_ORIGINS
        value: "https://qingshenghuo.pages.dev,http://localhost:5173"

databases:
  - name: qingshenghuo-db
    plan: free
    region: singapore
    # pgvector：free 档 Postgres 16+ 自带 vector 扩展。
    #   `vector` 扩展 + `food_embeddings` 表 + 余弦索引，现由构建阶段的
    #   apps/api/scripts/sync-embeddings-pg.mjs **幂等自动创建**（它读取
    #   infra/db/migrations/pg/001_pgvector.sql，定义只此一份），无需人工操作。
    #   如需手工执行（可选，可重复执行）：psql $DATABASE_URL_PG -f infra/db/migrations/pg/001_pgvector.sql
