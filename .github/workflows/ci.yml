# CI：以「热量引擎单元测试」为门禁（架构 T05 DoD），失败即阻断
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-engine-gate:
    name: 引擎单测门禁（P0）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 热量引擎单元测试 + 覆盖率门禁（≥90%）
        run: npm test -w @qsh/core
      - name: 全仓类型检查
        run: npm run typecheck --workspaces --if-present

  backend:
    name: 后端构建与 e2e
    runs-on: ubuntu-latest
    needs: core-engine-gate
    env:
      # SQLite 相对 schema 目录解析 → apps/api/prisma/dev.db（与本地 .env 一致）
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 后端构建 + e2e（pretest 自动建表并灌种子数据）
        run: npm test -w @qsh/api
      - name: Agent 评测（回放 fixtures，离线零成本）
        # 真实评测用 `node apps/api/eval/run-eval.mjs --live`（需 AI_API_KEY，会花钱）；
        # CI 只回放录制好的模型响应，验证「循环 + 断言逻辑」没被改坏。
        run: node apps/api/eval/run-eval.mjs --replay

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    needs: core-engine-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 前端单测
        run: npx vitest run --root apps/web
      - name: 构建（含 PWA 产物）
        run: npm run build -w @qsh/web
